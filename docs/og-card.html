<!doctype html>
<!--
  Source for public/og.png (the Open Graph / Twitter card image).
  Regenerate: open this file in a browser at exactly 1200x630 and screenshot
  the page (e.g. Playwright with a 1200x630 viewport), then save the capture
  as public/og.png. Colors are the app's light palette (src/index.css) plus
  the Okabe-Ito chart colors from src/ui/theme.ts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card source</title>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        src: url('../public/fonts/InterVariable.woff2') format('woff2');
      }

      @font-face {
        font-family: 'DM Serif Display';
        font-style: normal;
        font-weight: 400;
        src: url('../public/fonts/DMSerifDisplay-Regular.woff2') format('woff2');
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: #f8f3eb;
        color: #080331;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        position: relative;
      }

      .card {
        position: absolute;
        inset: 0;
        padding: 56px 80px 0;
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #3347e0;
        background: rgba(72, 101, 255, 0.12);
        border-radius: 999px;
        padding: 10px 22px;
      }

      .kicker .mark {
        display: inline-flex;
        gap: 4px;
        align-items: flex-end;
        height: 22px;
      }

      .kicker .mark i {
        display: block;
        width: 6px;
        border-radius: 2px;
      }

      h1 {
        margin-top: 24px;
        font-family: 'DM Serif Display', Georgia, 'Times New Roman', serif;
        font-size: 72px;
        line-height: 1.06;
        font-weight: 400;
        letter-spacing: 0;
        max-width: 980px;
      }

      .tagline {
        margin-top: 18px;
        font-size: 26px;
        line-height: 1.35;
        color: #5b5468;
        max-width: 840px;
      }

      .methods {
        margin-top: 24px;
        display: flex;
        gap: 12px;
      }

      .methods span {
        font-size: 17px;
        font-weight: 600;
        color: #080331;
        background: #ffffff;
        border: 1px solid #e7dfd0;
        border-radius: 999px;
        padding: 8px 18px;
        white-space: nowrap;
        box-shadow: 0 4px 4px rgba(75, 68, 57, 0.05), 0 12px 16px rgba(75, 68, 57, 0.08);
      }

      .chart-card {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: -24px;
        height: 176px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 16px rgba(99, 91, 79, 0.08), 0 32px 32px rgba(99, 91, 79, 0.08);
        overflow: hidden;
      }

      .chart-card svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="kicker">
        <span class="mark" aria-hidden="true">
          <i style="height: 12px; background: #0072b2"></i>
          <i style="height: 22px; background: #d55e00"></i>
          <i style="height: 17px; background: #009e73"></i>
        </span>
        Runs entirely in the browser
      </div>
      <h1>WFM Forecast &amp; Staffing Workbench</h1>
      <p class="tagline">
        Forecast contact volume, prove the accuracy with rolling-origin backtests, staff the
        intervals with Erlang A/C.
      </p>
      <div class="methods">
        <span>Seasonal moving average</span>
        <span>Holt-Winters</span>
        <span>Dynamic harmonic regression</span>
        <span>Inverse-WAPE ensemble</span>
      </div>
    </div>

    <!-- Chart motif: history bars, then a forecast line inside a shaded band. -->
    <div class="chart-card">
      <svg width="1072" height="176" viewBox="0 14 1072 176" aria-hidden="true">
        <!-- Warm gridlines -->
        <g stroke="#eae3d5" stroke-width="1">
          <line x1="0" y1="52" x2="1072" y2="52" />
          <line x1="0" y1="104" x2="1072" y2="104" />
          <line x1="0" y1="156" x2="1072" y2="156" />
        </g>
        <!-- History bars (Okabe-Ito blue) -->
        <g fill="#0072b2" opacity="0.85">
          <rect x="36" y="130" width="30" height="74" rx="3" />
          <rect x="77" y="106" width="30" height="98" rx="3" />
          <rect x="118" y="118" width="30" height="86" rx="3" />
          <rect x="159" y="82" width="30" height="122" rx="3" />
          <rect x="200" y="98" width="30" height="106" rx="3" />
          <rect x="241" y="70" width="30" height="134" rx="3" />
          <rect x="282" y="94" width="30" height="110" rx="3" />
          <rect x="323" y="62" width="30" height="142" rx="3" />
          <rect x="364" y="88" width="30" height="116" rx="3" />
          <rect x="405" y="74" width="30" height="130" rx="3" />
          <rect x="446" y="102" width="30" height="102" rx="3" />
          <rect x="487" y="68" width="30" height="136" rx="3" />
        </g>
        <!-- Forecast start divider (indigo accent) -->
        <line x1="546" y1="18" x2="546" y2="204" stroke="#4865ff" stroke-width="2" stroke-dasharray="6 6" opacity="0.55" />
        <!-- Shaded 80% band (Okabe-Ito orange, translucent) -->
        <path
          d="M 546 104 C 614 82, 686 126, 758 100 C 830 74, 902 116, 974 86 C 1010 72, 1042 78, 1072 68 L 1072 166 C 1042 158, 1010 168, 974 160 C 902 184, 830 148, 758 172 C 686 194, 614 154, 546 168 Z"
          fill="#e69f00"
          opacity="0.18"
        />
        <!-- Forecast line -->
        <path
          d="M 546 136 C 614 116, 686 160, 758 136 C 830 112, 902 150, 974 123 C 1010 110, 1042 120, 1072 112"
          fill="none"
          stroke="#e69f00"
          stroke-width="5"
          stroke-linecap="round"
        />
      </svg>
    </div>
  </body>
</html>
